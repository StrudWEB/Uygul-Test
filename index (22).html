let order = [];
let idx = 0;
let ok = 0, bad = 0;
let answered = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function newRound(){
  order = shuffle([...Array(QUESTIONS.length).keys()]);
  idx = 0;
  showQuestion();
}

function showQuestion(){
  answered = false;
  const qData = QUESTIONS[order[idx]];
  document.getElementById('q-counter').textContent = 'Soru ' + (idx+1) + ' / ' + QUESTIONS.length;
  document.getElementById('question').textContent = qData.q;
  const optsWrap = document.getElementById('options');
  optsWrap.innerHTML = '';

  const optionIdxs = qData.o.map((_,i)=>i);
  const shuffledOpts = shuffle(optionIdxs);

  shuffledOpts.forEach(function(origIdx){
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = qData.o[origIdx];
    btn.addEventListener('click', function(){ selectAnswer(origIdx, qData.c, btn, optsWrap); });
    optsWrap.appendChild(btn);
  });

  document.getElementById('next-btn').style.display = 'none';
}

function selectAnswer(chosenIdx, correctIdx, btnEl, optsWrap){
  if(answered) return;
  answered = true;
  const allBtns = optsWrap.querySelectorAll('.opt-btn');
  allBtns.forEach(function(b){ b.disabled = true; });

  if(chosenIdx === correctIdx){
    btnEl.classList.add('correct');
    ok++;
  } else {
    btnEl.classList.add('wrong');
    allBtns.forEach(function(b){
      if(b.textContent === QUESTIONS[order[idx]].o[correctIdx]){
        b.classList.add('correct');
      }
    });
    bad++;
  }
  document.getElementById('ok-count').textContent = ok;
  document.getElementById('bad-count').textContent = bad;

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = function(){
    idx++;
    if(idx >= order.length){
      newRound();
    } else {
      showQuestion();
    }
  };
}

newRound();
