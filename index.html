<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UYGUR TEST</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    min-height: 100%;
    margin: 0;
    background-color: cyan;
    font-family: Arial, Helvetica, sans-serif;
    color: black;
  }
  .title {
    text-align: center;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    font-weight: 900;
    letter-spacing: 0.05em;
    padding: 64px 16px 4px;
  }
  .topbar {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    z-index: 20;
    flex-wrap: wrap;
  }
  .auth-box {
    background: black;
    color: white;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 8px 12px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 60vw;
  }
  .auth-box .email {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 150px;
  }
  .premium-badge {
    background: linear-gradient(0deg,#d4a017,#f7d774);
    color: #3a2a00;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 900;
  }
  .free-badge {
    background: #444;
    color: #ccc;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .login-btn, .logout-btn {
    background: cyan;
    color: black;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 800;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .logout-btn { background: #ff4136; color: white; }
  .score-box {
    background: black;
    color: cyan;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 8px 14px;
    border-radius: 10px;
    text-align: right;
  }
  .score-box span.ok { color: #7CFC00; }
  .score-box span.bad { color: #ff5c5c; }
  .auth-msg {
    max-width: 640px;
    margin: 0 auto 12px;
    padding: 0 16px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: #7a0e0e;
  }
  .premium-panel {
    max-width: 640px;
    margin: 0 auto 18px;
    padding: 12px 16px;
    background: #fff6d9;
    border: 3px solid #d4a017;
    border-radius: 12px;
    display: none;
    text-align: center;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .quiz-wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 8px 16px 60px;
  }
  .q-counter {
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .question {
    background: white;
    border: 3px solid black;
    border-radius: 12px;
    padding: 18px;
    font-size: 1.15rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 18px;
  }
  .options {
    display: grid;
    gap: 12px;
  }
  .opt-btn {
    background: white;
    border: 3px solid black;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 1rem;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    color: black;
  }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { background: #2ecc40; border-color: #145a1c; color: black; }
  .opt-btn.wrong { background: #ff4136; border-color: #7a0e0e; color: black; }
  .next-btn {
    display: block;
    margin: 20px auto 0;
    background: black;
    color: cyan;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  .icon-btn {
    background: white;
    color: black;
    border: 2px solid black;
    border-radius: 8px;
    padding: 4px 8px;
    font-weight: 800;
    font-size: 0.8rem;
    cursor: pointer;
    line-height: 1;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: white;
    border: 4px solid black;
    border-radius: 14px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-box h2 {
    margin: 0 0 14px;
    font-size: 1.25rem;
    text-align: center;
  }
  .modal-close {
    display: block;
    margin: 16px auto 0;
    background: black;
    color: cyan;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-weight: 800;
    cursor: pointer;
  }
  .settings-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
    font-size: 0.9rem;
    font-weight: 700;
  }
  .settings-row span.val { color: #333; font-weight: 600; }
  .danger-btn {
    width: 100%;
    margin-top: 14px;
    background: #ff4136;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-weight: 800;
    cursor: pointer;
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: 6px;
  }
  .lb-row.me { background: #fff6d9; border: 2px solid #d4a017; }
  .lb-rank { width: 30px; color: #555; }
  .lb-email { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 8px; }
  .lb-score { color: #0a7d2c; }
  .admin-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 0.85rem;
  }
  .admin-row .admin-email { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .admin-toggle-btn {
    border: 2px solid black;
    border-radius: 8px;
    padding: 4px 10px;
    font-weight: 800;
    font-size: 0.75rem;
    cursor: pointer;
    background: #2ecc40;
    white-space: nowrap;
  }
  .admin-toggle-btn.is-premium { background: #ffcf40; }
  .admin-search {
    width: 100%;
    padding: 8px 10px;
    border: 2px solid black;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 10px;
    box-sizing: border-box;
  }
  .nick-btn {
    background: #fff6d9;
    color: black;
    border: 2px solid black;
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 800;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .auth-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .auth-tab-btn {
    flex: 1;
    background: #eee;
    color: black;
    border: 2px solid black;
    border-radius: 8px;
    padding: 8px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .auth-tab-btn.active { background: cyan; }
  .form-field {
    display: block;
    width: 100%;
    margin-bottom: 10px;
  }
  .form-field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .form-field input {
    width: 100%;
    padding: 9px 10px;
    border: 2px solid black;
    border-radius: 8px;
    font-size: 0.9rem;
    box-sizing: border-box;
  }
  .form-submit-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    background: black;
    color: cyan;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .form-error {
    color: #a30000;
    font-size: 0.82rem;
    font-weight: 700;
    margin-top: 6px;
    min-height: 1em;
  }
  .founder-badge {
    background: linear-gradient(0deg,#6a0dad,#b57edc);
    color: white;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 900;
  }
  .comments-btn {
    background: #fff6d9;
    color: black;
    border: 2px solid black;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .timer-box {
    text-align: center;
    font-weight: 900;
    font-size: 1rem;
    margin-bottom: 8px;
    color: black;
  }
  .timer-box.low { color: #ff4136; }
  .feedback-dock {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 150;
    display: none;
    pointer-events: none;
  }
  .feedback-dock.show { display: block; }
  .feedback-dock img {
    display: block;
    width: 220px;
    height: auto;
  }
  @media (min-width: 760px) {
    .feedback-dock img { width: 400px; }
  }
  @media (max-width: 759px) {
    .feedback-dock {
      right: 6px;
      top: auto;
      bottom: 14px;
      transform: none;
    }
  }
  .start-box {
    text-align: center;
  }
  .start-box p {
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .start-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    background: black;
    color: cyan;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-weight: 900;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .thread-list { margin-bottom: 10px; }
  .thread-row {
    padding: 10px;
    border: 2px solid black;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    background: #fafafa;
  }
  .thread-row .thread-title { font-weight: 800; font-size: 0.95rem; }
  .thread-row .thread-meta { font-size: 0.75rem; color: #555; margin-top: 2px; }
  .new-thread-box { margin-bottom: 14px; }
  .reply-row {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    font-size: 0.85rem;
  }
  .reply-row .reply-author { font-weight: 800; }
  .reply-row .reply-body { margin-top: 2px; }
  .back-link {
    background: none;
    border: none;
    color: #0645ad;
    font-weight: 800;
    cursor: pointer;
    padding: 0 0 10px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="auth-box" id="auth-box">
      <button class="login-btn" id="login-btn">Google ile giriş yap</button>
      <button class="nick-btn" id="nick-login-open-btn">Rumuzla giriş</button>
    </div>
    <div class="score-box">Doğru: <span class="ok" id="ok-count">0</span> &nbsp;|&nbsp; Yanlış: <span class="bad" id="bad-count">0</span></div>
  </div>

  <div class="title">UYGUR TEST</div>
  <div class="auth-msg" id="auth-msg"></div>
  <div class="premium-panel" id="premium-panel"></div>

  <div class="quiz-wrap" style="text-align:center;">
    <button class="comments-btn" id="comments-open-btn">💬 Sohbetler</button>
  </div>

  <div class="quiz-wrap" id="quiz-wrap" style="display:none;">
    <div class="timer-box" id="timer-box">Süre: 15</div>
    <div class="q-counter" id="q-counter"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <button class="next-btn" id="next-btn" style="display:none;">Sonraki Soru</button>
  </div>

  <div class="modal-overlay open" id="start-screen">
    <div class="modal-box start-box">
      <h2>UYGUR TEST'e Hoş Geldin!</h2>
      <p>200 soru, 4 şık, soru başına 15 saniyen var. Hazır olunca başla!</p>
      <button class="start-btn" id="start-quiz-btn">Başla</button>
    </div>
  </div>

  <div class="feedback-dock" id="feedback-dock">
    <img id="feedback-img" src="" alt="">
  </div>

  <div class="modal-overlay" id="comments-modal">
    <div class="modal-box">
      <h2>💬 Sohbetler</h2>
      <div id="thread-list-view">
        <div class="new-thread-box">
          <div class="form-field">
            <label for="new-thread-title">Yeni bir sohbet başlat</label>
            <input type="text" id="new-thread-title" placeholder="Ne hakkında konuşmak istersin?">
          </div>
          <button class="form-submit-btn" id="new-thread-submit-btn">Sohbet Başlat</button>
          <div class="form-error" id="new-thread-error"></div>
        </div>
        <div class="thread-list" id="thread-list"></div>
      </div>
      <div id="thread-detail-view" style="display:none;">
        <button class="back-link" id="thread-back-btn">← Sohbetlere dön</button>
        <h3 id="thread-detail-title" style="margin:0 0 10px;"></h3>
        <div id="thread-replies"></div>
        <div class="form-field" style="margin-top:12px;">
          <label for="new-reply-text">Yanıt yaz</label>
          <input type="text" id="new-reply-text" placeholder="yanıtını yaz...">
        </div>
        <button class="form-submit-btn" id="new-reply-submit-btn">Gönder</button>
        <div class="form-error" id="new-reply-error"></div>
      </div>
      <button class="modal-close" id="comments-close-btn">Kapat</button>
    </div>
  </div>

  <div class="modal-overlay" id="nick-auth-modal">
    <div class="modal-box">
      <h2>🙂 Rumuzla Giriş / Kayıt</h2>
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="nick-tab-login">Giriş Yap</button>
        <button class="auth-tab-btn" id="nick-tab-register">Kayıt Ol</button>
      </div>

      <div id="nick-login-form">
        <div class="form-field">
          <label for="nick-login-nickname">Rumuz</label>
          <input type="text" id="nick-login-nickname" autocomplete="username" placeholder="rumuzun">
        </div>
        <div class="form-field">
          <label for="nick-login-password">Şifre</label>
          <input type="password" id="nick-login-password" autocomplete="current-password" placeholder="şifren">
        </div>
        <button class="form-submit-btn" id="nick-login-submit-btn">Giriş Yap</button>
        <div class="form-error" id="nick-login-error"></div>
      </div>

      <div id="nick-register-form" style="display:none;">
        <div class="form-field">
          <label for="nick-register-nickname">Rumuz (3-20 karakter)</label>
          <input type="text" id="nick-register-nickname" autocomplete="username" placeholder="benzersiz bir rumuz seç">
        </div>
        <div class="form-field">
          <label for="nick-register-password">Şifre (en az 6 karakter)</label>
          <input type="password" id="nick-register-password" autocomplete="new-password" placeholder="bir şifre belirle">
        </div>
        <div class="form-field">
          <label for="nick-register-password2">Şifre (tekrar)</label>
          <input type="password" id="nick-register-password2" autocomplete="new-password" placeholder="şifreni tekrar yaz">
        </div>
        <button class="form-submit-btn" id="nick-register-submit-btn">Kayıt Ol</button>
        <div class="form-error" id="nick-register-error"></div>
      </div>

      <button class="modal-close" id="nick-auth-close-btn">Kapat</button>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <h2>⚙ Hesap Ayarları</h2>
      <div class="settings-row"><span>Hesap</span><span class="val" id="settings-email"></span></div>
      <div class="settings-row"><span>Üyelik</span><span class="val" id="settings-premium"></span></div>
      <div class="settings-row"><span>Toplam Doğru</span><span class="val" id="settings-correct"></span></div>
      <div class="settings-row"><span>Toplam Yanlış</span><span class="val" id="settings-wrong"></span></div>
      <div class="settings-row"><span>Başarı</span><span class="val" id="settings-accuracy"></span></div>
      <div class="form-field" style="margin-top:14px;">
        <label for="settings-nickname-input">Rumuz (leaderboard'da görünen ad)</label>
        <input type="text" id="settings-nickname-input" placeholder="bir rumuz belirle">
      </div>
      <button class="form-submit-btn" id="settings-nickname-save-btn">Rumuzu Kaydet</button>
      <div class="form-error" id="settings-nickname-error"></div>
      <button class="danger-btn" id="reset-stats-btn">İstatistikleri Sıfırla</button>
      <button class="modal-close" id="settings-close-btn">Kapat</button>
    </div>
  </div>

  <div class="modal-overlay" id="leaderboard-modal">
    <div class="modal-box">
      <h2>🏆 Lider Tablosu</h2>
      <div id="leaderboard-list"></div>
      <div id="leaderboard-me" style="margin-top:10px; font-weight:800; text-align:center; font-size:0.85rem;"></div>
      <button class="modal-close" id="leaderboard-close-btn">Kapat</button>
    </div>
  </div>

  <div class="modal-overlay" id="admin-modal">
    <div class="modal-box">
      <h2>🛠 Yönetici Paneli</h2>
      <input type="text" class="admin-search" id="admin-search-input" placeholder="Rumuz veya e-posta ile ara...">
      <div id="admin-list"></div>
      <button class="modal-close" id="admin-close-btn">Kapat</button>
    </div>
  </div>

const NICK_DOMAIN = "uygurtest.local"; // rumuz+şifre hesapları için sahte e-posta alanı

function slugifyNickname(nick){
  return (nick || '')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function nicknameToEmail(nick){
  const slug = slugifyNickname(nick);
  return slug + '@' + NICK_DOMAIN;
}

function isNicknameAccount(email){
  return !!email && email.toLowerCase().endsWith('@' + NICK_DOMAIN);
}

function displayName(row){
  if (row && row.nickname) return row.nickname;
  if (row && row.email) return maskEmail(row.email);
  return '???';
}

if (isSupabaseConfigured) {
  // persistSession: true -> oturum kapatılmadıkça tarayıcıda kalıcı olarak saklanır,
  // sayfa yenilense veya tarayıcı kapatılıp açılsa bile tekrar giriş yapmaya gerek kalmaz.
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });
}

const authBox = document.getElementById('auth-box');
const authMsg = document.getElementById('auth-msg');
const premiumPanel = document.getElementById('premium-panel');

function renderLoggedOut(message){
  authBox.innerHTML =
    '<button class="login-btn" id="login-btn">Google ile giriş yap</button>' +
    '<button class="nick-btn" id="nick-login-open-btn">Rumuzla giriş</button>';
  document.getElementById('login-btn').addEventListener('click', signInWithGoogle);
  document.getElementById('nick-login-open-btn').addEventListener('click', function(){ openModal('nick-auth-modal'); });
  premiumPanel.style.display = 'none';
  authMsg.textContent = message || '';
  isAdminUser = false;
  closeModal('settings-modal');
  closeModal('leaderboard-modal');
  closeModal('admin-modal');
}

function renderLoggedIn(user, profile){
  const badge = profile && profile.is_premium
    ? '<span class="premium-badge">★ PREMIUM</span>'
    : '<span class="free-badge">Ücretsiz</span>';
  isAdminUser = !!(profile && profile.is_admin);
  const isFounder = (user.email || '').toLowerCase() === FOUNDER_EMAIL;
  const roleBadge = isFounder ? '<span class="founder-badge">👑 KURUCU</span>' : '';
  authBox.innerHTML =
    '<span class="email">' + displayName(profile || { email: user.email }) + '</span>' +
    badge +
    roleBadge +
    '<button class="icon-btn" id="settings-btn" title="Hesap Ayarları">⚙</button>' +
    '<button class="icon-btn" id="leaderboard-btn" title="Lider Tablosu">🏆</button>' +
    (isAdminUser ? '<button class="icon-btn" id="admin-btn" title="Yönetici Paneli">🛠</button>' : '') +
    '<button class="logout-btn" id="logout-btn">Çıkış</button>';
  document.getElementById('logout-btn').addEventListener('click', function(){
    supabaseClient.auth.signOut();
  });
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.getElementById('leaderboard-btn').addEventListener('click', openLeaderboard);
  if (isAdminUser) document.getElementById('admin-btn').addEventListener('click', openAdmin);
  authMsg.textContent = '';

  if (profile && profile.is_premium) {
    const total = (profile.correct_count || 0) + (profile.wrong_count || 0);
    const acc = total > 0 ? Math.round((profile.correct_count || 0) / total * 100) : 0;
    premiumPanel.style.display = 'block';
    premiumPanel.innerHTML =
      '★ Premium üyesin — ömür boyu istatistiklerin<br>' +
      'Toplam Doğru: ' + (profile.correct_count || 0) +
      ' &nbsp;|&nbsp; Toplam Yanlış: ' + (profile.wrong_count || 0) +
      ' &nbsp;|&nbsp; Başarı: %' + acc;
  } else {
    premiumPanel.style.display = 'none';
  }
}

async function signInWithGoogle(){
  if (!isSupabaseConfigured) {
    alert('Supabase henüz ayarlanmadı. Sayfanın HTML kodundaki SUPABASE_URL ve SUPABASE_ANON_KEY alanlarını doldurman gerekiyor.');
    return;
  }
  await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
}

async function registerWithNickname(nickname, password){
  const errEl = document.getElementById('nick-register-error');
  errEl.textContent = '';
  const nick = (nickname || '').trim();
  const slug = slugifyNickname(nick);

  if (nick.length < 3 || nick.length > 20) {
    errEl.textContent = 'Rumuz 3-20 karakter olmalı.';
    return;
  }
  if (!slug) {
    errEl.textContent = 'Bu rumuz geçerli karakter içermiyor, farklı bir rumuz dene.';
    return;
  }
  if (password.length < 6) {
    errEl.textContent = 'Şifre en az 6 karakter olmalı.';
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email: nicknameToEmail(nick),
    password: password,
    options: { data: { nickname: nick } }
  });

  if (error) {
    if ((error.message || '').toLowerCase().includes('already') || (error.message || '').toLowerCase().includes('registered')) {
      errEl.textContent = 'Bu rumuz zaten alınmış, başka bir rumuz dene.';
    } else {
      errEl.textContent = 'Kayıt olunamadı: ' + error.message;
    }
    return;
  }

  if (!data.session) {
    errEl.textContent = 'Kayıt oluşturuldu ama otomatik giriş yapılamadı. "Giriş Yap" sekmesinden tekrar dene.';
    return;
  }

  closeModal('nick-auth-modal');
}

async function loginWithNickname(nickname, password){
  const errEl = document.getElementById('nick-login-error');
  errEl.textContent = '';
  const nick = (nickname || '').trim();
  if (!nick || !password) {
    errEl.textContent = 'Rumuz ve şifre gerekli.';
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: nicknameToEmail(nick),
    password: password
  });

  if (error) {
    errEl.textContent = 'Rumuz veya şifre hatalı.';
    return;
  }

  closeModal('nick-auth-modal');
}

async function loadProfile(user){
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .maybeSingle();

  if (error) {
    console.error('Profil okunamadı:', error);
    return null;
  }

  if (!data) {
    const { data: inserted, error: insertError } = await supabaseClient
      .from('profiles')
      .insert({
        id: user.id,
        email: user.email,
        nickname: (user.user_metadata && user.user_metadata.nickname) || null
      })
      .select()
      .maybeSingle();
    if (insertError) {
      console.error('Profil oluşturulamadı:', insertError);
      return null;
    }
    return inserted;
  }
  return data;
}

async function handleUserSession(user){
  if (!user) {
    currentUser = null;
    currentProfile = null;
    renderLoggedOut();
    return;
  }

  const email = (user.email || '').toLowerCase();
  // Rumuz+şifre hesapları sahte @uygurtest.local adresiyle çalışır, Gmail
  // kısıtlaması sadece Google girişiyle gelen gerçek hesaplar için geçerli.
  if (!isNicknameAccount(email) && !email.endsWith('@gmail.com')) {
    await supabaseClient.auth.signOut();
    currentUser = null;
    currentProfile = null;
    renderLoggedOut('Sadece Gmail (@gmail.com) hesaplarıyla veya rumuz+şifre ile giriş yapılabilir.');
    return;
  }

  currentUser = user;
  currentProfile = await loadProfile(user);
  lifetimeOk = (currentProfile && currentProfile.correct_count) || 0;
  lifetimeBad = (currentProfile && currentProfile.wrong_count) || 0;
  renderLoggedIn(user, currentProfile);
}

if (isSupabaseConfigured) {
  // Google ile giriş döndüğünde URL'de ?code=... ya da #access_token=... olur;
  // detectSessionInUrl bunu otomatik işler ama işlemin bitmesini BEKLEMEMİZ gerekir,
  // yoksa getSession() henüz oturum oluşmadan boş döner ve "giriş yapılmadı" gibi görünür.
  const hasAuthRedirect = window.location.hash.includes('access_token') ||
    window.location.search.includes('code=') ||
    window.location.hash.includes('error');

  supabaseClient.auth.onAuthStateChange(function(event, session){
    handleUserSession(session ? session.user : null);
    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && (window.location.hash || window.location.search.includes('code='))) {
      // Giriş sonrası URL'deki token/code parçasını temizle, yoksa sayfa
      // yenilendiğinde tarayıcı eski/geçersiz bir parçayla tekrar işlem yapmaya çalışabilir.
      const cleanUrl = window.location.origin + window.location.pathname;
      window.history.replaceState({}, document.title, cleanUrl);
    }
  });

  if (!hasAuthRedirect) {
    supabaseClient.auth.getSession().then(function(res){
      handleUserSession(res.data.session ? res.data.session.user : null);
    });
  } else {
    authMsg.textContent = 'Giriş kontrol ediliyor...';
  }

  document.getElementById('login-btn').addEventListener('click', signInWithGoogle);
  document.getElementById('nick-login-open-btn').addEventListener('click', function(){ openModal('nick-auth-modal'); });

  document.getElementById('nick-tab-login').addEventListener('click', function(){
    document.getElementById('nick-tab-login').classList.add('active');
    document.getElementById('nick-tab-register').classList.remove('active');
    document.getElementById('nick-login-form').style.display = 'block';
    document.getElementById('nick-register-form').style.display = 'none';
  });
  document.getElementById('nick-tab-register').addEventListener('click', function(){
    document.getElementById('nick-tab-register').classList.add('active');
    document.getElementById('nick-tab-login').classList.remove('active');
    document.getElementById('nick-register-form').style.display = 'block';
    document.getElementById('nick-login-form').style.display = 'none';
  });
  document.getElementById('nick-auth-close-btn').addEventListener('click', function(){ closeModal('nick-auth-modal'); });

  document.getElementById('nick-login-submit-btn').addEventListener('click', function(){
    loginWithNickname(
      document.getElementById('nick-login-nickname').value,
      document.getElementById('nick-login-password').value
    );
  });

  document.getElementById('nick-register-submit-btn').addEventListener('click', function(){
    const pw1 = document.getElementById('nick-register-password').value;
    const pw2 = document.getElementById('nick-register-password2').value;
    const errEl = document.getElementById('nick-register-error');
    if (pw1 !== pw2) {
      errEl.textContent = 'Şifreler eşleşmiyor.';
      return;
    }
    registerWithNickname(document.getElementById('nick-register-nickname').value, pw1);
  });
} else {
  renderLoggedOut('Giriş sistemi aktif değil: Supabase bilgileri henüz tanımlanmadı.');
}

async function syncScoreToSupabase(){
  if (!isSupabaseConfigured || !currentUser) return;
  const { error } = await supabaseClient
    .from('profiles')
    .update({
      correct_count: lifetimeOk,
      wrong_count: lifetimeBad,
      updated_at: new Date().toISOString()
    })
    .eq('id', currentUser.id);
  if (error) console.error('Skor kaydedilemedi:', error);
  else if (currentProfile) {
    currentProfile.correct_count = lifetimeOk;
    currentProfile.wrong_count = lifetimeBad;
    if (currentProfile.is_premium) renderLoggedIn(currentUser, currentProfile);
  }
}

function maskEmail(email){
  if (!email) return '???';
  const parts = email.split('@');
  const name = parts[0];
  if (name.length <= 2) return name[0] + '***@' + parts[1];
  return name.slice(0,2) + '***@' + parts[1];
}

/* ===================== Hesap ayarları ===================== */
function openSettings(){
  if (!currentUser || !currentProfile) return;
  const accountLabel = isNicknameAccount(currentUser.email)
    ? (currentProfile.nickname || 'rumuz hesabı')
    : currentUser.email;
  document.getElementById('settings-email').textContent = accountLabel;
  document.getElementById('settings-premium').textContent = currentProfile.is_premium ? '★ Premium' : 'Ücretsiz';
  document.getElementById('settings-correct').textContent = currentProfile.correct_count || 0;
  document.getElementById('settings-wrong').textContent = currentProfile.wrong_count || 0;
  const total = (currentProfile.correct_count || 0) + (currentProfile.wrong_count || 0);
  const acc = total > 0 ? Math.round((currentProfile.correct_count || 0) / total * 100) : 0;
  document.getElementById('settings-accuracy').textContent = '%' + acc;
  document.getElementById('settings-nickname-input').value = currentProfile.nickname || '';
  document.getElementById('settings-nickname-error').textContent = '';
  openModal('settings-modal');
}

async function saveNickname(){
  const errEl = document.getElementById('settings-nickname-error');
  errEl.textContent = '';
  if (!currentUser || !currentProfile) return;

  const nick = document.getElementById('settings-nickname-input').value.trim();
  if (!nick) {
    errEl.textContent = 'Boş rumuz kaydedilemez.';
    return;
  }
  if (nick.length < 3 || nick.length > 20) {
    errEl.textContent = 'Rumuz 3-20 karakter olmalı.';
    return;
  }

  const { error } = await supabaseClient
    .from('profiles')
    .update({ nickname: nick, updated_at: new Date().toISOString() })
    .eq('id', currentUser.id);

  if (error) {
    if (error.code === '23505') {
      errEl.textContent = 'Bu rumuz zaten alınmış.';
    } else {
      errEl.textContent = 'Kaydedilemedi: ' + error.message;
    }
    return;
  }

  currentProfile.nickname = nick;
  renderLoggedIn(currentUser, currentProfile);
  errEl.style.color = '#0a7d2c';
  errEl.textContent = 'Rumuz kaydedildi!';
}

async function resetStats(){
  if (!currentUser) return;
  if (!confirm('Tüm istatistiklerin (toplam doğru/yanlış) sıfırlanacak. Emin misin?')) return;
  lifetimeOk = 0;
  lifetimeBad = 0;
  ok = 0;
  bad = 0;
  document.getElementById('ok-count').textContent = 0;
  document.getElementById('bad-count').textContent = 0;
  await syncScoreToSupabase();
  openSettings();
}

/* ===================== Lider tablosu ===================== */
async function openLeaderboard(){
  openModal('leaderboard-modal');
  const listEl = document.getElementById('leaderboard-list');
  const meEl = document.getElementById('leaderboard-me');
  listEl.textContent = 'Yükleniyor...';
  meEl.textContent = '';

  const { data, error } = await supabaseClient
    .from('profiles')
    .select('id,email,nickname,correct_count,wrong_count,is_premium')
    .order('correct_count', { ascending: false })
    .limit(20);

  if (error) {
    listEl.textContent = 'Lider tablosu yüklenemedi.';
    console.error(error);
    return;
  }

  listEl.innerHTML = '';
  data.forEach(function(row, i){
    const isMe = currentUser && row.id === currentUser.id;
    const div = document.createElement('div');
    div.className = 'lb-row' + (isMe ? ' me' : '');
    const star = row.is_premium ? ' ★' : '';
    div.innerHTML =
      '<span class="lb-rank">#' + (i + 1) + '</span>' +
      '<span class="lb-email">' + displayName(row) + star + (isMe ? ' (sen)' : '') + '</span>' +
      '<span class="lb-score">' + (row.correct_count || 0) + ' D</span>';
    listEl.appendChild(div);
  });

  if (currentUser && !data.some(function(r){ return r.id === currentUser.id; })) {
    meEl.textContent = 'İlk 20\'de değilsin — daha çok soru çöz!';
  }
}

async function openAdmin(){
  if (!isAdminUser) return;
  document.getElementById('admin-search-input').value = '';
  openModal('admin-modal');
  await loadAdminUsers('');
}

async function loadAdminUsers(query){
  const listEl = document.getElementById('admin-list');
  listEl.textContent = 'Yükleniyor...';

  let req = supabaseClient
    .from('profiles')
    .select('id,email,nickname,is_premium,correct_count,wrong_count')
    .order('created_at', { ascending: false })
    .limit(30);

  if (query) {
    req = supabaseClient
      .from('profiles')
      .select('id,email,nickname,is_premium,correct_count,wrong_count')
      .or('email.ilike.%' + query + '%,nickname.ilike.%' + query + '%')
      .limit(30);
  }

  const { data, error } = await req;
  if (error) {
    listEl.textContent = 'Liste yüklenemedi.';
    console.error(error);
    return;
  }
  if (!data.length) {
    listEl.textContent = 'Kullanıcı bulunamadı.';
    return;
  }

  listEl.innerHTML = '';
  data.forEach(function(u){
    const row = document.createElement('div');
    row.className = 'admin-row';
    const label = (u.nickname ? u.nickname + ' · ' : '') + u.email;
    row.innerHTML =
      '<span class="admin-email">' + label + '</span>' +
      '<button class="admin-toggle-btn' + (u.is_premium ? ' is-premium' : '') + '" data-id="' + u.id + '" data-val="' + (!u.is_premium) + '">' +
      (u.is_premium ? 'Premium ✓' : 'Premium Yap') +
      '</button>';
    listEl.appendChild(row);
  });

  listEl.querySelectorAll('.admin-toggle-btn').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const id = btn.getAttribute('data-id');
      const newVal = btn.getAttribute('data-val') === 'true';
      const { error: updErr } = await supabaseClient
        .from('profiles')
        .update({ is_premium: newVal })
        .eq('id', id);
      if (updErr) {
        alert('Güncellenemedi: ' + updErr.message);
        return;
      }
      await loadAdminUsers(document.getElementById('admin-search-input').value.trim());
    });
  });
}

let order = [];
let idx = 0;
let ok = 0, bad = 0;
let answered = false;
let lifetimeOk = 0;
let lifetimeBad = 0;

const QUESTION_SECONDS = 15;
let timeLeft = QUESTION_SECONDS;
let timerInterval = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function newRound(){
  order = shuffle([...Array(QUESTIONS.length).keys()]);
  idx = 0;
  showQuestion();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = QUESTION_SECONDS;
  updateTimerDisplay();
  timerInterval = setInterval(function(){
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);
}

function updateTimerDisplay(){
  const box = document.getElementById('timer-box');
  box.textContent = 'Süre: ' + timeLeft;
  box.classList.toggle('low', timeLeft <= 5);
}

function showQuestion(){
  answered = false;
  const qData = QUESTIONS[order[idx]];
  document.getElementById('q-counter').textContent = 'Soru ' + (idx+1) + ' / ' + QUESTIONS.length;
  document.getElementById('question').textContent = qData.q;
  const optsWrap = document.getElementById('options');
  optsWrap.innerHTML = '';

  const optionIdxs = qData.o.map((_,i)=>i);
  const shuffledOpts = shuffle(optionIdxs);

  shuffledOpts.forEach(function(origIdx){
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = qData.o[origIdx];
    btn.addEventListener('click', function(){ selectAnswer(origIdx, qData.c, btn, optsWrap); });
    optsWrap.appendChild(btn);
  });

  document.getElementById('next-btn').style.display = 'none';
  startTimer();
}

function goNext(){
  idx++;
  if(idx >= order.length){
    newRound();
  } else {
    showQuestion();
  }
}

function handleTimeout(){
  if(answered) return;
  answered = true;
  const optsWrap = document.getElementById('options');
  const allBtns = optsWrap.querySelectorAll('.opt-btn');
  // Süre bittiğinde doğru cevap işaretlenmez/gösterilmez — direkt yanlış sayılır.
  allBtns.forEach(function(b){ b.disabled = true; });

  bad++;
  lifetimeBad++;
  document.getElementById('bad-count').textContent = bad;
  syncScoreToSupabase();
  showFeedback('timeout');

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = goNext;
}

function selectAnswer(chosenIdx, correctIdx, btnEl, optsWrap){
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);
  const allBtns = optsWrap.querySelectorAll('.opt-btn');
  allBtns.forEach(function(b){ b.disabled = true; });

  if(chosenIdx === correctIdx){
    btnEl.classList.add('correct');
    ok++;
    lifetimeOk++;
    showFeedback('correct');
  } else {
    btnEl.classList.add('wrong');
    allBtns.forEach(function(b){
      if(b.textContent === QUESTIONS[order[idx]].o[correctIdx]){
        b.classList.add('correct');
      }
    });
    bad++;
    lifetimeBad++;
    showFeedback('wrong');
  }
  document.getElementById('ok-count').textContent = ok;
  document.getElementById('bad-count').textContent = bad;
  syncScoreToSupabase();

  const nextBtn = document.getElementById('next-btn');
  nextBtn.style.display = 'block';
  nextBtn.onclick = goNext;
}

document.getElementById('start-quiz-btn').addEventListener('click', function(){
  showFeedback('start');
  setTimeout(function(){
    closeModal('start-screen');
    document.getElementById('quiz-wrap').style.display = '';
    newRound();
  }, 1200);
});

/* ===================== Sohbetler (yorumlar) ===================== */
let activeThreadId = null;
const profileCache = {};

async function fetchProfilesFor(ids){
  const missing = ids.filter(function(id){ return !profileCache[id]; });
  if (missing.length) {
    const { data } = await supabaseClient
      .from('profiles')
      .select('id,email,nickname')
      .in('id', missing);
    (data || []).forEach(function(p){ profileCache[p.id] = p; });
  }
  return ids.map(function(id){ return profileCache[id]; });
}

function requireLoginForComments(){
  if (!currentUser) {
    alert('Sohbetlere katılmak için önce giriş yapmalısın (Google ya da rumuz+şifre ile).');
    return false;
  }
  return true;
}

async function openComments(){
  if (!isSupabaseConfigured) {
    alert('Sohbet sistemi aktif değil: Supabase bilgileri henüz tanımlanmadı.');
    return;
  }
  openModal('comments-modal');
  showThreadList();
  await loadThreads();
}

function showThreadList(){
  activeThreadId = null;
  document.getElementById('thread-list-view').style.display = 'block';
  document.getElementById('thread-detail-view').style.display = 'none';
}

async function loadThreads(){
  const listEl = document.getElementById('thread-list');
  listEl.textContent = 'Yükleniyor...';

  const { data, error } = await supabaseClient
    .from('comment_threads')
    .select('id,title,author_id,created_at')
    .order('created_at', { ascending: false })
    .limit(40);

  if (error) {
    listEl.textContent = 'Sohbetler yüklenemedi.';
    console.error(error);
    return;
  }
  if (!data.length) {
    listEl.textContent = 'Henüz hiç sohbet yok, ilk sohbeti sen başlat!';
    return;
  }

  const profiles = await fetchProfilesFor(data.map(function(t){ return t.author_id; }));
  listEl.innerHTML = '';
  data.forEach(function(t, i){
    const authorName = profiles[i] ? displayName(profiles[i]) : '???';
    const row = document.createElement('div');
    row.className = 'thread-row';
    row.innerHTML =
      '<div class="thread-title">' + t.title + '</div>' +
      '<div class="thread-meta">' + authorName + ' · ' + new Date(t.created_at).toLocaleString('tr-TR') + '</div>';
    row.addEventListener('click', function(){ openThread(t.id, t.title); });
    listEl.appendChild(row);
  });
}

async function openThread(threadId, title){
  activeThreadId = threadId;
  document.getElementById('thread-list-view').style.display = 'none';
  document.getElementById('thread-detail-view').style.display = 'block';
  document.getElementById('thread-detail-title').textContent = title;
  document.getElementById('new-reply-error').textContent = '';
  document.getElementById('new-reply-text').value = '';
  await loadReplies(threadId);
}

async function loadReplies(threadId){
  const repliesEl = document.getElementById('thread-replies');
  repliesEl.textContent = 'Yükleniyor...';

  const { data, error } = await supabaseClient
    .from('comment_replies')
    .select('id,body,author_id,created_at')
    .eq('thread_id', threadId)
    .order('created_at', { ascending: true })
    .limit(100);

  if (error) {
    repliesEl.textContent = 'Yanıtlar yüklenemedi.';
    console.error(error);
    return;
  }
  if (!data.length) {
    repliesEl.innerHTML = '<div class="reply-row">Henüz yanıt yok, ilk yanıtı sen yaz!</div>';
    return;
  }

  const profiles = await fetchProfilesFor(data.map(function(r){ return r.author_id; }));
  repliesEl.innerHTML = '';
  data.forEach(function(r, i){
    const authorName = profiles[i] ? displayName(profiles[i]) : '???';
    const div = document.createElement('div');
    div.className = 'reply-row';
    div.innerHTML =
      '<span class="reply-author">' + authorName + '</span>' +
      '<div class="reply-body"></div>';
    div.querySelector('.reply-body').textContent = r.body;
    repliesEl.appendChild(div);
  });
}

document.getElementById('comments-open-btn').addEventListener('click', openComments);
document.getElementById('comments-close-btn').addEventListener('click', function(){ closeModal('comments-modal'); });
document.getElementById('thread-back-btn').addEventListener('click', showThreadList);

document.getElementById('new-thread-submit-btn').addEventListener('click', async function(){
  const errEl = document.getElementById('new-thread-error');
  errEl.textContent = '';
  if (!requireLoginForComments()) return;
  const title = document.getElementById('new-thread-title').value.trim();
  if (!title) {
    errEl.textContent = 'Bir başlık yaz.';
    return;
  }
  if (title.length > 120) {
    errEl.textContent = 'Başlık en fazla 120 karakter olabilir.';
    return;
  }
  const { error } = await supabaseClient
    .from('comment_threads')
    .insert({ title: title, author_id: currentUser.id });
  if (error) {
    errEl.textContent = 'Sohbet başlatılamadı: ' + error.message;
    return;
  }
  document.getElementById('new-thread-title').value = '';
  await loadThreads();
});

document.getElementById('new-reply-submit-btn').addEventListener('click', async function(){
  const errEl = document.getElementById('new-reply-error');
  errEl.textContent = '';
  if (!requireLoginForComments()) return;
  if (!activeThreadId) return;
  const body = document.getElementById('new-reply-text').value.trim();
  if (!body) {
    errEl.textContent = 'Boş yanıt gönderilemez.';
    return;
  }
  const { error } = await supabaseClient
    .from('comment_replies')
    .insert({ thread_id: activeThreadId, author_id: currentUser.id, body: body });
  if (error) {
    errEl.textContent = 'Yanıt gönderilemedi: ' + error.message;
    return;
  }
  document.getElementById('new-reply-text').value = '';
  await loadReplies(activeThreadId);
});
</script>
